services:  
  db:  
    image: postgis/postgis:15-3.4  
    container_name: warehouse-db-simple  
    restart: unless-stopped  
    environment:  
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}  
      POSTGRES_USER: ${POSTGRES_USER:-warehouse}  
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warehouse}  
    volumes:  
      - postgres_simple_data:/var/lib/postgresql/data  
    healthcheck:  
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-warehouse} -d ${POSTGRES_DB:-warehouse}" ]  
      interval: 10s  
      timeout: 5s  
      retries: 10  
      start_period: 10s  
    ports:  
      - "${DB_PORT:-5432}:5432"  
    networks:  
      - warehouse-backend  
  
  backend:  
    build:  
      context: ./backend  
      dockerfile: Dockerfile  
    container_name: warehouse-backend-simple  
    restart: unless-stopped  
    depends_on:  
      db:  
        condition: service_healthy  
      geoserver:  
        condition: service_started  
    environment:  
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}  
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-warehouse}  
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-warehouse}  
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-warehouse}  
      SECURITY_JWT_ISSUER: ${SECURITY_JWT_ISSUER:-warehouse-platform-api}  
      SECURITY_JWT_AUDIENCE: ${SECURITY_JWT_AUDIENCE:-warehouse-platform-web}  
      SECURITY_JWT_ACCESS_TOKEN_TTL: ${SECURITY_JWT_ACCESS_TOKEN_TTL:-10m}  
      SECURITY_JWT_REFRESH_TOKEN_TTL: ${SECURITY_JWT_REFRESH_TOKEN_TTL:-14d}  
      SECURITY_JWT_KEY_ID: ${SECURITY_JWT_KEY_ID:-warehouse-k1}  
      SECURITY_JWT_PRIVATE_KEY: file:/run/secrets/jwt_private_key  
      SECURITY_JWT_PUBLIC_KEY: file:/run/secrets/jwt_public_key  
      SECURITY_AUTH_REFRESH_COOKIE_NAME: ${SECURITY_AUTH_REFRESH_COOKIE_NAME:-refresh_token}  
      SECURITY_AUTH_REFRESH_COOKIE_PATH: ${SECURITY_AUTH_REFRESH_COOKIE_PATH:-/landlord/auth}  
      SECURITY_AUTH_REFRESH_COOKIE_SAME_SITE: ${SECURITY_AUTH_REFRESH_COOKIE_SAME_SITE:-Lax}  
      SECURITY_AUTH_REFRESH_COOKIE_SECURE: ${SECURITY_AUTH_REFRESH_COOKIE_SECURE:-false}  
      SECURITY_AUTH_REFRESH_COOKIE_DOMAIN: ${SECURITY_AUTH_REFRESH_COOKIE_DOMAIN:-}  
      SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS: ${SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}  
      GEOSERVER_URL: http://geoserver:8080/geoserver  
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}  
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}  
      GEOSERVER_DB_HOST: db  
      GEOSERVER_DB_PORT: 5432  
      GEOSERVER_DB_NAME: ${POSTGRES_DB:-warehouse}  
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -XX:+UseContainerSupport}  
    secrets:  
      - jwt_private_key  
      - jwt_public_key  
    ports:  
      - "${BACKEND_PORT:-8081}:8080"  
    networks:  
      - warehouse-backend  
      - warehouse-frontend  
  
  frontend:  
    build:  
      context: ./frontend  
      dockerfile: Dockerfile  
      args:  
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8081}  
    container_name: warehouse-frontend-simple  
    restart: unless-stopped  
    depends_on:  
      - backend  
    environment:  
      PORT: 8080  
      BACKEND_UPSTREAM: http://backend:8080  
    ports:  
      - "${FRONTEND_PORT:-3000}:8080"  
    networks:  
      - warehouse-frontend  
  
  geoserver:  
    image: kartoza/geoserver:2.25.2  
    container_name: warehouse-geoserver-simple  
    restart: unless-stopped  
    depends_on:  
      db:  
        condition: service_healthy  
    environment:  
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}  
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}  
      GEOSERVER_DATA_DIR: /opt/geoserver_data  
      INITIAL_MEMORY: 512M  
      MAXIMUM_MEMORY: 1G  
    volumes:  
      - geoserver_simple_data:/opt/geoserver_data  
    ports:  
      - "${GEOSERVER_PORT:-8600}:8080"  
    networks:  
      - warehouse-backend  
  
networks:  
  warehouse-backend:  
    driver: bridge  
  warehouse-frontend:  
    driver: bridge  
  
volumes:  
  postgres_simple_data:  
  geoserver_simple_data:  
  
secrets:  
  jwt_private_key:  
    file: ./backend/src/test/resources/keys/jwt-private.pem  
  jwt_public_key:  
    file: ./backend/src/test/resources/keys/jwt-public.pem
