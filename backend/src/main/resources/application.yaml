spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/warehouse}
    username: ${SPRING_DATASOURCE_USERNAME:warehouse}
    password: ${SPRING_DATASOURCE_PASSWORD:warehouse}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: false

  liquibase:
    enabled: false

multitenancy:
  bootstrap-schema: master
  schema-cache:
    maximumSize: 100
    expireAfterAccess: 10
  master:
    schema: master
    repository:
      packages: com.warehouse.warehouse_platform.multi_tenancy.repository
    entityManager:
      packages: com.warehouse.warehouse_platform.multi_tenancy.domain.entity
    liquibase:
      enabled: true
      change-log: classpath:db/changelog/db.changelog-master.yaml
  tenant:
    repository:
      packages: com.warehouse.warehouse_platform.user,com.warehouse.warehouse_platform.auth.session,com.warehouse.warehouse_platform.tenant.uom,com.warehouse.warehouse_platform.tenant.supplier,com.warehouse.warehouse_platform.tenant.product,com.warehouse.warehouse_platform.tenant.category,com.warehouse.warehouse_platform.tenant.audit
    entityManager:
      packages: com.warehouse.warehouse_platform.user,com.warehouse.warehouse_platform.auth.session,com.warehouse.warehouse_platform.tenant.uom,com.warehouse.warehouse_platform.tenant.supplier,com.warehouse.warehouse_platform.tenant.product,com.warehouse.warehouse_platform.tenant.category,com.warehouse.warehouse_platform.tenant.audit
    liquibase:
      enabled: true
      change-log: classpath:db/changelog/db.changelog-tenant.yaml

security:
  cors:
    allowed-origin-patterns: ${SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  jwt:
    issuer: ${SECURITY_JWT_ISSUER:warehouse-platform-api}
    audience: ${SECURITY_JWT_AUDIENCE:warehouse-platform-web}
    access-token-ttl: ${SECURITY_JWT_ACCESS_TOKEN_TTL:10m}
    refresh-token-ttl: ${SECURITY_JWT_REFRESH_TOKEN_TTL:14d}
    key-id: ${SECURITY_JWT_KEY_ID:warehouse-k1}
    private-key: ${SECURITY_JWT_PRIVATE_KEY:file:keys/jwt-private.pem}
    public-key: ${SECURITY_JWT_PUBLIC_KEY:file:keys/jwt-public.pem}
  auth:
    refresh-cookie:
      name: ${SECURITY_AUTH_REFRESH_COOKIE_NAME:refresh_token}
      path: ${SECURITY_AUTH_REFRESH_COOKIE_PATH:/landlord/auth}
      same-site: ${SECURITY_AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
      secure: ${SECURITY_AUTH_REFRESH_COOKIE_SECURE:false}
      domain: ${SECURITY_AUTH_REFRESH_COOKIE_DOMAIN:}
