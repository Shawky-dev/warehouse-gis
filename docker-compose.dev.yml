services:
  db:
    image: postgis/postgis:15-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DEV_POSTGRES_DB}
      POSTGRES_USER: ${DEV_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DEV_POSTGRES_USER} -d ${DEV_POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "${DEV_DB_PORT}:5432"

  geoserver:
    image: kartoza/geoserver:2.25.2
    restart: unless-stopped
    environment:
      GEOSERVER_ADMIN_USER: ${DEV_GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${DEV_GEOSERVER_ADMIN_PASSWORD:-geoserver}
      GEOSERVER_DATA_DIR: /opt/geoserver_data
      INITIAL_MEMORY: 512M
      MAXIMUM_MEMORY: 1G
    volumes:
      - geoserver_data:/opt/geoserver_data
    ports:
      - "${DEV_GEOSERVER_PORT:-8600}:8080" # access at http://localhost:${DEV_GEOSERVER_PORT:-8600}/geoserver
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_dev_data:
  geoserver_data:
