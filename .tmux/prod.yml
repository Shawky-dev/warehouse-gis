session_name: warehouse-prod
start_directory: .

windows:
  - window_name: infra
    layout: even-vertical
    panes:
      - docker compose up -d --wait
      - watch -n 3 docker compose ps

  - window_name: logs
    layout: tiled
    panes:
      - docker compose logs -f --tail=200 backend
      - docker compose logs -f --tail=200 frontend
      - docker compose logs -f --tail=200 db

  - window_name: ngrok
    panes:
      - >
        bash -lc '
        if [ -n "${NGROK_AUTHTOKEN:-}" ]; then
          ngrok config add-authtoken "$NGROK_AUTHTOKEN" >/dev/null 2>&1 || true;
        fi;
        APP_PORT="${FRONTEND_PORT:-8080}";
        if [ -n "${NGROK_DOMAIN:-}" ]; then
          exec ngrok http --domain="$NGROK_DOMAIN" "$APP_PORT";
        else
          exec ngrok http "$APP_PORT";
        fi'
