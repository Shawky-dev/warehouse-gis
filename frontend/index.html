<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vite-app</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Polyfill WebGPU constants for browsers without WebGPU support.
         @thatopen/components bundles three.js which accesses self.GPUShaderStage
         unconditionally when self is defined, throwing in non-WebGPU browsers. -->
    <script>
      if (typeof self !== 'undefined' && typeof self.GPUShaderStage === 'undefined') {
        self.GPUShaderStage = { VERTEX: 1, FRAGMENT: 2, COMPUTE: 4 };
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
